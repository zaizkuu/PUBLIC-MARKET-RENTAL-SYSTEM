name: Release installer

# Builds the Windows installer on a Windows machine and publishes it as a
# GitHub release, so the .exe can be downloaded from the Releases page.
# Run it from the Actions tab ("Run workflow"), or push a tag such as v0.3.0.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: '1'

      - name: Run tests
        run: npm test

      - name: Build installer
        run: |
          npm run build
          npx electron-builder --win nsis --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Read version
        id: version
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Tanauan Public Market System ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          body: |
            Windows installer for version ${{ steps.version.outputs.version }}.

            Download **TanauanPublicMarketSystem-Setup-${{ steps.version.outputs.version }}.exe** below and run it.
            The installer is not code-signed, so Windows SmartScreen may warn on first run:
            click "More info", then "Run anyway".
          files: release/TanauanPublicMarketSystem-Setup-${{ steps.version.outputs.version }}.exe
